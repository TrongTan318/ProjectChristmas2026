# /etc/nginx/sites-available/hangda.conf
# Thay hangda.example.com bằng tên miền thật. SSL do certbot tự thêm (certbot --nginx).

upstream hangda_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Microcache trang công khai 10 giây: 5.000 người vào cùng lúc vẫn chỉ ~1 request/10s tới app.
proxy_cache_path /var/cache/nginx/hangda levels=1:2 keys_zone=hangda_cache:20m max_size=500m inactive=30m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=hangda_vote:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hangda_admin:10m rate=5r/s;
limit_req_status 429;

# Có cookie admin/bình chọn → không dùng cache.
map $http_cookie $hangda_skip_cache {
    default 0;
    ~*admin_session 1;
    ~*vote_session 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name hangda.example.com;

    # Cloudflare (nếu dùng): bỏ comment và include danh sách IP Cloudflare để lấy IP thật của người dùng.
    # include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 210m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;

    # Ảnh/video đã tối ưu: Nginx phục vụ trực tiếp từ đĩa.
    location /media/ {
        alias /srv/hangda/storage/media/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        types { image/webp webp; video/mp4 mp4; }
        default_type application/octet-stream;
        location ~* \.(php|html?|js|sh)$ { return 404; }
        try_files $uri =404;
    }

    # Nhạc nền: Nginx cache cả file, tự phục vụ yêu cầu tua (Range) từ cache.
    location /music/ {
        proxy_pass http://hangda_app;
        proxy_cache hangda_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        access_log off;
        expires 1d;
    }

    location /_next/static/ {
        proxy_pass http://hangda_app;
        proxy_cache hangda_cache;
        proxy_cache_valid 200 365d;
        access_log off;
        expires 1y;
    }

    # Luồng bình chọn: không cache, rate limit.
    location ~ ^/(v/|binh-chon|vote) {
        limit_req zone=hangda_vote burst=30 nodelay;
        proxy_pass http://hangda_app;
    }

    location /admin {
        limit_req zone=hangda_admin burst=40 nodelay;
        proxy_pass http://hangda_app;
    }

    location /api/admin/ {
        limit_req zone=hangda_admin burst=40 nodelay;
        proxy_request_buffering off; # stream upload video
        proxy_pass http://hangda_app;
    }

    location /api/ {
        limit_req zone=hangda_vote burst=30 nodelay;
        proxy_pass http://hangda_app;
    }

    # Trang công khai: microcache.
    location / {
        proxy_pass http://hangda_app;
        proxy_cache hangda_cache;
        proxy_cache_key "$scheme$host$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_state_tree|$http_next_url";
        proxy_cache_valid 200 10s;
        proxy_cache_valid 404 5s;
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $hangda_skip_cache;
        proxy_no_cache $hangda_skip_cache;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
        proxy_cache_background_update on;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache $upstream_cache_status;
    }
}
